#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# --- AWS / AppSync ---
awsRegion=us-east-1
appSyncApiId=YOUR_APPSYNC_API_ID

# Comma-separated Lambda function names to download
lambdaFunctions=upload-url,encode-on-approval,mediaconvert-status,publish-scheduler

# Output folder (relative to project root)
artifactOutDir=build/artifacts
